# Contract Enforcement - Backend
# This workflow prevents silent contract drift for CORE and CFO APIs
#
# PART 3: Change Gate
# - Detects changes to /api/core/state and /api/cfo/* endpoints
# - Requires fixture updates when contracts change
# - Runs schema validation tests

name: Contract Enforcement

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  contract-check:
    name: Contract Check (CORE + CFO)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-mock

      # =========================================================================
      # CORE STATE CONTRACT ENFORCEMENT
      # =========================================================================

      - name: Check CORE contract files for changes
        id: core-contract-changes
        run: |
          echo "Checking for CORE state contract changes..."

          CORE_CONTRACT_CHANGED=false
          CORE_FIXTURE_CHANGED=false

          # Check if contract files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "app/routers/core_state.py"; then
            echo "Contract file changed: app/routers/core_state.py"
            CORE_CONTRACT_CHANGED=true
          fi

          # Check if fixture files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "tests/fixtures/core_state_factory.py"; then
            echo "Fixture file changed: tests/fixtures/core_state_factory.py"
            CORE_FIXTURE_CHANGED=true
          fi

          echo "contract_changed=$CORE_CONTRACT_CHANGED" >> $GITHUB_OUTPUT
          echo "fixture_changed=$CORE_FIXTURE_CHANGED" >> $GITHUB_OUTPUT

      - name: Verify CORE fixture updates for contract changes
        if: steps.core-contract-changes.outputs.contract_changed == 'true'
        run: |
          if [ "${{ steps.core-contract-changes.outputs.fixture_changed }}" != "true" ]; then
            echo "❌ BLOCKED: CORE contract changed but fixtures not updated!"
            echo ""
            echo "CORE State contract file was modified:"
            echo "  - app/routers/core_state.py"
            echo ""
            echo "You MUST update the test fixtures to match:"
            echo "  - tests/fixtures/core_state_factory.py"
            echo ""
            exit 1
          fi
          echo "✅ CORE contract changed AND fixtures updated - compliance verified"

      - name: Run CORE contract tests
        run: |
          echo "Running CORE state contract tests..."
          python -m pytest tests/test_core_sync_contract.py -v

      - name: Run CORE schema validation tests
        run: |
          echo "Running CORE schema validation tests..."
          python -m pytest tests/test_core_state_schema.py -v

      - name: Run CORE standalone contract tests
        run: |
          echo "Running CORE standalone contract tests..."
          python tests/test_core_sync_contract_standalone.py

      # =========================================================================
      # CFO CONTRACT ENFORCEMENT
      # =========================================================================

      - name: Check CFO contract files for changes
        id: cfo-contract-changes
        run: |
          echo "Checking for CFO contract changes..."

          CFO_CONTRACT_CHANGED=false
          CFO_FIXTURE_CHANGED=false

          # Check if CFO model files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "app/cfo/models.py"; then
            echo "Contract file changed: app/cfo/models.py"
            CFO_CONTRACT_CHANGED=true
          fi

          # Check if CFO router files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "app/cfo/router.py"; then
            echo "Contract file changed: app/cfo/router.py"
            CFO_CONTRACT_CHANGED=true
          fi

          # Check if fixture files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "tests/fixtures/cfo_state_factory.py"; then
            echo "Fixture file changed: tests/fixtures/cfo_state_factory.py"
            CFO_FIXTURE_CHANGED=true
          fi

          echo "contract_changed=$CFO_CONTRACT_CHANGED" >> $GITHUB_OUTPUT
          echo "fixture_changed=$CFO_FIXTURE_CHANGED" >> $GITHUB_OUTPUT

      - name: Verify CFO fixture updates for contract changes
        if: steps.cfo-contract-changes.outputs.contract_changed == 'true'
        run: |
          if [ "${{ steps.cfo-contract-changes.outputs.fixture_changed }}" != "true" ]; then
            echo "❌ BLOCKED: CFO contract changed but fixtures not updated!"
            echo ""
            echo "CFO contract files were modified. Check for:"
            echo "  - app/cfo/models.py"
            echo "  - app/cfo/router.py"
            echo ""
            echo "You MUST update the test fixtures to match:"
            echo "  - tests/fixtures/cfo_state_factory.py"
            echo ""
            exit 1
          fi
          echo "✅ CFO contract changed AND fixtures updated - compliance verified"

      - name: Run CFO contract tests
        run: |
          echo "Running CFO contract tests..."
          python -m pytest tests/test_cfo_contract.py -v

      - name: Run CFO standalone contract tests
        run: |
          echo "Running CFO standalone contract tests..."
          python tests/test_cfo_contract_standalone.py
