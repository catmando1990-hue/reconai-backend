# Contract Enforcement - Backend
# This workflow prevents silent contract drift for CORE, CFO, Intelligence, and GovCon APIs
#
# PART 3: Change Gate
# - Detects changes to /api/core/state, /api/cfo/*, /api/intelligence/*, and /api/govcon/* endpoints
# - Requires fixture updates when contracts change
# - Runs schema validation tests

name: Contract Enforcement

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  contract-check:
    name: Contract Check (CORE + CFO + Intelligence + GovCon)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-mock

      # =========================================================================
      # CORE STATE CONTRACT ENFORCEMENT
      # =========================================================================

      - name: Check CORE contract files for changes
        id: core-contract-changes
        run: |
          echo "Checking for CORE state contract changes..."

          CORE_CONTRACT_CHANGED=false
          CORE_FIXTURE_CHANGED=false

          # Check if contract files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "app/routers/core_state.py"; then
            echo "Contract file changed: app/routers/core_state.py"
            CORE_CONTRACT_CHANGED=true
          fi

          # Check if fixture files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "tests/fixtures/core_state_factory.py"; then
            echo "Fixture file changed: tests/fixtures/core_state_factory.py"
            CORE_FIXTURE_CHANGED=true
          fi

          echo "contract_changed=$CORE_CONTRACT_CHANGED" >> $GITHUB_OUTPUT
          echo "fixture_changed=$CORE_FIXTURE_CHANGED" >> $GITHUB_OUTPUT

      - name: Verify CORE fixture updates for contract changes
        if: steps.core-contract-changes.outputs.contract_changed == 'true'
        run: |
          if [ "${{ steps.core-contract-changes.outputs.fixture_changed }}" != "true" ]; then
            echo "❌ BLOCKED: CORE contract changed but fixtures not updated!"
            echo ""
            echo "CORE State contract file was modified:"
            echo "  - app/routers/core_state.py"
            echo ""
            echo "You MUST update the test fixtures to match:"
            echo "  - tests/fixtures/core_state_factory.py"
            echo ""
            exit 1
          fi
          echo "✅ CORE contract changed AND fixtures updated - compliance verified"

      - name: Run CORE contract tests
        run: |
          echo "Running CORE state contract tests..."
          python -m pytest tests/test_core_sync_contract.py -v

      - name: Run CORE schema validation tests
        run: |
          echo "Running CORE schema validation tests..."
          python -m pytest tests/test_core_state_schema.py -v

      - name: Run CORE standalone contract tests
        run: |
          echo "Running CORE standalone contract tests..."
          python tests/test_core_sync_contract_standalone.py

      # =========================================================================
      # CFO CONTRACT ENFORCEMENT
      # =========================================================================

      - name: Check CFO contract files for changes
        id: cfo-contract-changes
        run: |
          echo "Checking for CFO contract changes..."

          CFO_CONTRACT_CHANGED=false
          CFO_FIXTURE_CHANGED=false

          # Check if CFO model files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "app/cfo/models.py"; then
            echo "Contract file changed: app/cfo/models.py"
            CFO_CONTRACT_CHANGED=true
          fi

          # Check if CFO router files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "app/cfo/router.py"; then
            echo "Contract file changed: app/cfo/router.py"
            CFO_CONTRACT_CHANGED=true
          fi

          # Check if fixture files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "tests/fixtures/cfo_state_factory.py"; then
            echo "Fixture file changed: tests/fixtures/cfo_state_factory.py"
            CFO_FIXTURE_CHANGED=true
          fi

          echo "contract_changed=$CFO_CONTRACT_CHANGED" >> $GITHUB_OUTPUT
          echo "fixture_changed=$CFO_FIXTURE_CHANGED" >> $GITHUB_OUTPUT

      - name: Verify CFO fixture updates for contract changes
        if: steps.cfo-contract-changes.outputs.contract_changed == 'true'
        run: |
          if [ "${{ steps.cfo-contract-changes.outputs.fixture_changed }}" != "true" ]; then
            echo "❌ BLOCKED: CFO contract changed but fixtures not updated!"
            echo ""
            echo "CFO contract files were modified. Check for:"
            echo "  - app/cfo/models.py"
            echo "  - app/cfo/router.py"
            echo ""
            echo "You MUST update the test fixtures to match:"
            echo "  - tests/fixtures/cfo_state_factory.py"
            echo ""
            exit 1
          fi
          echo "✅ CFO contract changed AND fixtures updated - compliance verified"

      - name: Run CFO contract tests
        run: |
          echo "Running CFO contract tests..."
          python -m pytest tests/test_cfo_contract.py -v

      - name: Run CFO standalone contract tests
        run: |
          echo "Running CFO standalone contract tests..."
          python tests/test_cfo_contract_standalone.py

      # =========================================================================
      # INTELLIGENCE CONTRACT ENFORCEMENT
      # =========================================================================

      - name: Check Intelligence contract files for changes
        id: intelligence-contract-changes
        run: |
          echo "Checking for Intelligence contract changes..."

          INTEL_CONTRACT_CHANGED=false
          INTEL_FIXTURE_CHANGED=false

          # Check if Intelligence model files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "app/intelligence/models.py"; then
            echo "Contract file changed: app/intelligence/models.py"
            INTEL_CONTRACT_CHANGED=true
          fi

          # Check if Intelligence guardrails changed
          if git diff --name-only HEAD~1 HEAD | grep -q "app/guardrails/intelligence_contract.py"; then
            echo "Contract file changed: app/guardrails/intelligence_contract.py"
            INTEL_CONTRACT_CHANGED=true
          fi

          # Check if Intelligence router files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "app/routers/intelligence"; then
            echo "Contract file changed: app/routers/intelligence*.py"
            INTEL_CONTRACT_CHANGED=true
          fi

          # Check if fixture files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "tests/fixtures/intelligence_state_factory.py"; then
            echo "Fixture file changed: tests/fixtures/intelligence_state_factory.py"
            INTEL_FIXTURE_CHANGED=true
          fi

          echo "contract_changed=$INTEL_CONTRACT_CHANGED" >> $GITHUB_OUTPUT
          echo "fixture_changed=$INTEL_FIXTURE_CHANGED" >> $GITHUB_OUTPUT

      - name: Verify Intelligence fixture updates for contract changes
        if: steps.intelligence-contract-changes.outputs.contract_changed == 'true'
        run: |
          if [ "${{ steps.intelligence-contract-changes.outputs.fixture_changed }}" != "true" ]; then
            echo "❌ BLOCKED: Intelligence contract changed but fixtures not updated!"
            echo ""
            echo "Intelligence contract files were modified. Check for:"
            echo "  - app/intelligence/models.py"
            echo "  - app/guardrails/intelligence_contract.py"
            echo "  - app/routers/intelligence*.py"
            echo ""
            echo "You MUST update the test fixtures to match:"
            echo "  - tests/fixtures/intelligence_state_factory.py"
            echo ""
            exit 1
          fi
          echo "✅ Intelligence contract changed AND fixtures updated - compliance verified"

      - name: Run Intelligence contract tests
        run: |
          echo "Running Intelligence contract tests..."
          python -m pytest tests/test_intelligence_contract.py -v

      - name: Run Intelligence standalone contract tests
        run: |
          echo "Running Intelligence standalone contract tests..."
          python tests/test_intelligence_contract_standalone.py

      # =========================================================================
      # GOVCON CONTRACT ENFORCEMENT (DCAA Compliance)
      # =========================================================================

      - name: Check GovCon contract files for changes
        id: govcon-contract-changes
        run: |
          echo "Checking for GovCon/DCAA contract changes..."

          GOVCON_CONTRACT_CHANGED=false
          GOVCON_FIXTURE_CHANGED=false

          # Check if GovCon model files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "app/govcon/models.py"; then
            echo "Contract file changed: app/govcon/models.py"
            GOVCON_CONTRACT_CHANGED=true
          fi

          # Check if GovCon contract file changed
          if git diff --name-only HEAD~1 HEAD | grep -q "app/govcon/contract.py"; then
            echo "Contract file changed: app/govcon/contract.py"
            GOVCON_CONTRACT_CHANGED=true
          fi

          # Check if GovCon router files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "app/routers/govcon"; then
            echo "Contract file changed: app/routers/govcon*.py"
            GOVCON_CONTRACT_CHANGED=true
          fi

          # Check if fixture files changed
          if git diff --name-only HEAD~1 HEAD | grep -q "tests/fixtures/govcon_state_factory.py"; then
            echo "Fixture file changed: tests/fixtures/govcon_state_factory.py"
            GOVCON_FIXTURE_CHANGED=true
          fi

          echo "contract_changed=$GOVCON_CONTRACT_CHANGED" >> $GITHUB_OUTPUT
          echo "fixture_changed=$GOVCON_FIXTURE_CHANGED" >> $GITHUB_OUTPUT

      - name: Verify GovCon fixture updates for contract changes
        if: steps.govcon-contract-changes.outputs.contract_changed == 'true'
        run: |
          if [ "${{ steps.govcon-contract-changes.outputs.fixture_changed }}" != "true" ]; then
            echo "❌ BLOCKED: GovCon/DCAA contract changed but fixtures not updated!"
            echo ""
            echo "GovCon contract files were modified. Check for:"
            echo "  - app/govcon/models.py"
            echo "  - app/govcon/contract.py"
            echo "  - app/routers/govcon*.py"
            echo ""
            echo "You MUST update the test fixtures to match:"
            echo "  - tests/fixtures/govcon_state_factory.py"
            echo ""
            echo "DCAA COMPLIANCE NOTICE: GovCon contract changes affect audit trail integrity."
            exit 1
          fi
          echo "✅ GovCon contract changed AND fixtures updated - DCAA compliance verified"

      - name: Run GovCon contract tests
        run: |
          echo "Running GovCon/DCAA contract tests..."
          python -m pytest tests/test_govcon_contract.py -v

      - name: Run GovCon state factory self-tests
        run: |
          echo "Running GovCon state factory self-tests..."
          python -c "exec(open('tests/fixtures/govcon_state_factory.py').read()); _run_self_tests()"
